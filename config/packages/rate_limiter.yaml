framework:
    rate_limiter:
        # Messages du formulaire de contact : 5 par heure et par adresse IP.
        # Autowiring : RateLimiterFactoryInterface $contactLimiter
        contact:
            policy: "sliding_window"
            limit: 5
            interval: "1 hour"

        # Accusés de réception du formulaire de contact : 3 par jour et par adresse email.
        # Autowiring : RateLimiterFactoryInterface $contactAckLimiter
        contact_ack:
            policy: "sliding_window"
            limit: 3
            interval: "1 day"
