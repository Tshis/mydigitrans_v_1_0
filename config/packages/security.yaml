# config/packages/security.yaml
security:
    # Hachage automatique des mots de passe utilisateurs de gares
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # Chargement de ton entité étanche multi-tenant
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Autorise les outils de développement et l'App Shell de la PWA sans filtrage
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # 🚨 LE VERROU SOUVERAIN : Ton authentificateur d'origine est l'unique juge
            entry_point: App\Security\UserAuthenticator
            custom_authenticator: App\Security\UserAuthenticator

            # 🌟 LE CORRECTIF CHIRURGICAL : Suppression du bloc form_login obsolète.
            # C'est ton UserAuthenticator qui gère le traitement de la mire de saisie.

            logout:
                path: security_login_logout
                target: security_login_index # Redirige proprement vers ton écran d'accueil après déconnexion

            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800 # Conserve la session mobile active pendant 7 jours en gare
                path: /

    # Gestion granulaire des accès aux consoles d'exploitations MyDigitrans
    access_control:
        # Tu débloqueras ces lignes au fur et à mesure du développement de tes contrôleurs :
        # - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        # - { path: ^/admin, roles: ROLE_AGENCY_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
